on: [push]

name: CI

jobs:

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      # No phel compile cache: composer.lock is git-ignored, so the cache key
      # can't include the resolved phel version, and a stale cache from an
      # older phel build breaks lint/test. Compiling fresh each run is ~1s.

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Phel doctor
        run: composer doctor

      - name: Phel format check
        run: composer format-check

      - name: Phel lint
        run: composer lint -- --format=github

      - name: Run phel tests
        run: composer test

      - name: Build standalone binary
        run: composer build

      - name: Smoke test built binary
        run: |
          php out/main.php --version
          php out/main.php add 1 2 3 | grep -q "Sum = 6"
          php out/main.php greet ci --loud | grep -q "HELLO, CI!"

      - name: Export and run the PHP example
        run: |
          composer export
          php example/using-exported-phel-function.php | grep -q "Result = 6"
